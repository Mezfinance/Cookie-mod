modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "All Rights Reserved"
issueTrackerURL = "https://github.com/Mezfinance/Cookie-mod/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},1.22)"
ordering = "NONE"
side = "BOTH"

# TerraBlender powers the cookie biome's overworld injection + surface rules.
# Required: CurseForge/launchers auto-install it alongside Cookie Mod.
[[dependencies.${mod_id}]]
modId = "terrablender"
type = "required"
versionRange = "[4.1.0.0,)"
ordering = "AFTER"
side = "BOTH"
