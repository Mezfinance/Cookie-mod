plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = project.mod_version
group = project.mod_group_id
base {
    archivesName = project.mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven {
        name = 'GlitchFiend (TerraBlender)'
        url = 'https://maven.minecraftforge.net'
    }
}

neoForge {
    version = project.neo_version

    // Human-readable Mojang mappings are the default; Parchment can be layered on later.

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
        }
    }

    mods {
        cookiemod {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // NeoForge (Minecraft + FML) is provided by the moddev plugin above.
    // TerraBlender: overworld biome injection + surface rules for the cookie biome.
    // Declared required in neoforge.mods.toml so CurseForge/launchers auto-install it.
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${terrablender_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : project.minecraft_version,
            neo_version_range      : project.neo_version_range,
            loader_version_range   : project.loader_version_range,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_version            : project.mod_version,
            mod_authors            : project.mod_authors,
            mod_description        : project.mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
